name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'enhance/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: frontend/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: frontend/dist/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (dependencies + secrets)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: frontend/node_modules
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Trivy config scan (Dockerfiles, docker-compose)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  sbom-license:
    name: SBOM & License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: frontend/sbom.json
      - name: License compliance gate (no GPL/AGPL)
        run: npx --yes license-checker --production --failOn "GPL;GPL-2.0;GPL-3.0;AGPL;AGPL-3.0;LGPL;LGPL-2.1;LGPL-3.0"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    container:
      image: semgrep/semgrep
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        run: semgrep scan --config=p/security-audit --config=p/secrets --config=p/owasp-top-ten --config=p/typescript --config=p/react --error

  tenant-isolation:
    name: Tenant Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/supabase
    env:
      AUTH_URL: http://127.0.0.1:9999
      REST_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v7
      # Real "start Postgres/GoTrue/PostgREST" per the migration plan's
      # Phase 7 scope — no Kong, no realtime/edge-runtime/webauthn/frontend.
      # `db`'s docker-entrypoint-initdb.d applies migrations/*.sql
      # automatically on first boot (init-migrations.sh), so there is no
      # separate "apply migrations" step: db reporting healthy already means
      # migrated.
      - name: Generate stack secrets
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -hex 32)"
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=${POSTGRES_PASSWORD}#" .env
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=${JWT_SECRET}#" .env
          KEYS="$(JWT_SECRET="${JWT_SECRET}" node ../scripts/generate-supabase-keys.mjs)"
          ANON_KEY="$(echo "${KEYS}" | grep '^ANON_KEY=' | cut -d= -f2-)"
          SERVICE_ROLE_KEY="$(echo "${KEYS}" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2-)"
          sed -i "s#^ANON_KEY=.*#ANON_KEY=${ANON_KEY}#" .env
          sed -i "s#^SERVICE_ROLE_KEY=.*#SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}#" .env
          echo "SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - name: Start db, auth, rest
        run: docker compose up -d --build db auth rest
      - name: Wait for auth + rest to report healthy
        run: |
          for i in $(seq 1 60); do
            AUTH_STATUS="$(docker inspect --format='{{.State.Health.Status}}' barangay-supabase-auth 2>/dev/null || echo starting)"
            REST_STATUS="$(docker inspect --format='{{.State.Health.Status}}' barangay-supabase-rest 2>/dev/null || echo starting)"
            if [ "$AUTH_STATUS" = "healthy" ] && [ "$REST_STATUS" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "auth/rest did not become healthy in time" >&2
          docker compose logs
          exit 1
      - name: Run tenant isolation checks
        working-directory: backend
        run: node scripts/test-tenant-isolation.mjs
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

