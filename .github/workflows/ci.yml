name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'enhance/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  E2E_ADMIN_EMAIL: admin@e2e.local
  E2E_ADMIN_PASSWORD: E2eAdmin123!
  E2E_USER_EMAIL: test@barangay.gov.ph
  E2E_USER_PASSWORD: Test1234!
  VITE_API_URL: http://127.0.0.1:8090

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: frontend/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: frontend/dist/

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  tenant-isolation:
    name: Tenant Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      PB_VERSION: '0.39.5'
      PB_URL: http://127.0.0.1:8090
      PB_SUPERUSER_EMAIL: admin@e2e.local
      PB_SUPERUSER_PASSWORD: E2eAdmin123!
    steps:
      - uses: actions/checkout@v7
      - name: Download PocketBase
        run: |
          curl -sL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q /tmp/pb.zip -d /tmp/pb
      - name: Apply migrations + create test superuser
        run: /tmp/pb/pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir=/tmp/pb_data --migrationsDir=pb_migrations --automigrate
      - name: Start PocketBase
        run: |
          /tmp/pb/pocketbase serve --http=127.0.0.1:8090 --dir=/tmp/pb_data --migrationsDir=pb_migrations --automigrate > /tmp/pb_server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8090/api/health && break
            sleep 1
          done
      - name: Run tenant isolation checks
        run: node scripts/test-tenant-isolation.mjs
      - name: Show PocketBase log on failure
        if: failure()
        run: cat /tmp/pb_server.log || true

