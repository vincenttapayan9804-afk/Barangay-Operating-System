# Rate limiting zones (shared across both server blocks below).
# General API traffic: generous, just guards against runaway clients/bots.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# Auth endpoints: tight, to slow down password/MFA brute-forcing.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# Cap concurrent connections per IP as a basic flood guard.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Realtime's websocket upgrade — nginx only forwards the Upgrade/Connection
# headers through when the client actually asked for one; a plain HTTP
# request to the same path (e.g. a health probe) gets Connection: close
# instead, which is what proxying to a non-websocket backend expects.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP server — redirects to HTTPS when available, or serves directly for LAN
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # style-src needs 'unsafe-inline': framer-motion drives animations via
    # inline style="" attributes, which CSP's style-src also governs (no
    # separate style-src-attr is set, so the fallback covers both attr and
    # elem forms). connect-src covers this same nginx origin (the normal
    # single-domain Cloudflare Tunnel deployment proxies /rest/v1/ etc. right
    # here — see the location blocks below) plus Cloudinary (image uploads)
    # and Sentry (error reporting). Self-hosters who set VITE_LOCAL_API_URL
    # for a direct-to-LAN fallback must add that LAN origin to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://api.cloudinary.com https://*.sentry.io https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    limit_conn conn_limit 20;

    # Tighter rate limit on auth endpoints specifically (brute-force guard).
    # Longer literal prefix wins over the general /rest/v1/ location below,
    # regardless of declaration order.
    location /auth/v1/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # Passkey (WebAuthn) sidecar — same brute-force guard as the other auth
    # endpoints above. Not behind Kong (see kong.yml) — this sidecar talks
    # to the rest of the stack itself, authenticated as service_role.
    location /api/webauthn/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://webauthn:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy REST API requests to PostgREST (via Kong)
    location /rest/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Realtime — websocket upgrade required, unlike every other route here.
    location /realtime/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Edge Functions — supabase.functions.invoke(...) calls (notifications,
    # search proxy, create-barangay-admin).
    location /functions/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
    }

    # Generic ops signal — no longer read by check-scale-signals.mjs (Phase 6
    # replaced this with pg_stat_activity, a much more direct measure of
    # backend load), kept as a simple connection-count metric in its own
    # right. Internal only — never exposed publicly.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS server — same site, served securely. Certificates are generated at
# Docker build time (self-signed placeholder). Override with real mkcert
# certs by mounting them at /etc/nginx/certs/ at runtime.
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/cert-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # See the HTTP server block above for why style-src/connect-src are
    # scoped the way they are.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://api.cloudinary.com https://*.sentry.io https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # Not preloaded — this cert may be a self-signed LAN placeholder; only
    # commit to preload once a real, trusted domain cert is in place.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    limit_conn conn_limit 20;

    location /auth/v1/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    location /api/webauthn/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://webauthn:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /realtime/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /functions/v1/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
