# Rate limiting zones (shared across both server blocks below).
# General API traffic: generous, just guards against runaway clients/bots.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# Auth endpoints: tight, to slow down password/OTP brute-forcing.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# Cap concurrent connections per IP as a basic flood guard.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP server — redirects to HTTPS when available, or serves directly for LAN
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    limit_conn conn_limit 20;

    # Tighter rate limit on auth endpoints specifically (brute-force guard).
    # Longer literal prefix wins over the general /api/ location below,
    # regardless of declaration order.
    location ~ ^/api/collections/users/(auth-with-password|auth-with-otp|request-otp|request-password-reset) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # Proxy API requests to PocketBase
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy PocketBase admin UI
    location /_/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Connection-count signal for scripts/check-scale-signals.mjs (Phase 2
    # scale monitoring). Internal only — never exposed publicly. If this
    # 403s for the monitor script in your setup, widen the allow list below
    # to match your actual Docker network subnet (`docker network inspect`).
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS server — same site, served securely. Certificates are generated at
# Docker build time (self-signed placeholder). Override with real mkcert
# certs by mounting them at /etc/nginx/certs/ at runtime.
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/cert-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Not preloaded — this cert may be a self-signed LAN placeholder; only
    # commit to preload once a real, trusted domain cert is in place.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    limit_conn conn_limit 20;

    # Tighter rate limit on auth endpoints specifically (brute-force guard).
    # Longer literal prefix wins over the general /api/ location below,
    # regardless of declaration order.
    location ~ ^/api/collections/users/(auth-with-password|auth-with-otp|request-otp|request-password-reset) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # Proxy API requests to PocketBase
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy PocketBase admin UI
    location /_/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
