# pgBackRest static config — Phase 6, replaces backend/litestream.yml.
# Everything that varies per deployment (bucket, endpoint, credentials) is
# an env var instead (PGBACKREST_REPO1_S3_*, set in docker-compose.yml from
# this directory's .env), same split litestream.yml itself used — this file
# is safe to commit, nothing here is a secret.
[global]
repo1-retention-full=4
repo1-retention-full-type=count
start-fast=y
log-level-console=info
log-level-file=detail

[barangay]
pg1-path=/var/lib/postgresql/data
