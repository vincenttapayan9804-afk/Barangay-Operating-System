services:
  pocketbase:
    build: .
    container_name: barangay-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - GOMEMLIMIT=512MiB
      - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    depends_on:
      - meilisearch
    command: >
      /pb/pocketbase serve
      --http=0.0.0.0:8090
      --dir=/pb/pb_data
      --migrationsDir=/pb/pb_migrations
      --hooksDir=/pb/pb_hooks
      --automigrate

  # Full-text search for residents/documents/blotter. Internal-only — no
  # host port published, reached solely by pocketbase's pb_hooks/search.pb.js
  # over the Docker network. The frontend never talks to this directly and
  # never sees MEILI_MASTER_KEY; every search/index request is proxied and
  # tenant-filtered server-side (see docs/DEPLOYMENT.md "Full-text search").
  # No-op / search silently falls back to the existing PocketBase-query path
  # until MEILI_MASTER_KEY below is set.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: barangay-meilisearch
    restart: unless-stopped
    volumes:
      - meili_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
      - MEILI_NO_ANALYTICS=true
      # Meilisearch refuses to start in "production" mode without a master
      # key, so this defaults to "development" (no key required) and only
      # switches once MEILI_ENV is explicitly set — do that alongside
      # setting a real MEILI_MASTER_KEY, never one without the other.
      - MEILI_ENV=${MEILI_ENV:-development}

  # Continuous SQLite backup to S3-compatible storage (R2, Oracle Object
  # Storage, etc.). Streams the WAL in near-real-time instead of relying on
  # periodic full-snapshot backups, so a lost volume costs seconds of data,
  # not minutes. No-op / fails to start until the LITESTREAM_* vars below are
  # set — see docs/DEPLOYMENT.md "Continuous backups (Litestream)".
  litestream:
    image: litestream/litestream:0.3
    container_name: barangay-litestream
    restart: unless-stopped
    depends_on:
      - pocketbase
    volumes:
      - pb_data:/pb/pb_data:ro
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
      - LITESTREAM_REGION=${LITESTREAM_REGION:-auto}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
    command: replicate -config /etc/litestream.yml

  # WebAuthn/passkey sidecar. PocketBase has no native WebAuthn support, so
  # this small service owns the attestation/assertion cryptography (via
  # @simplewebauthn/server) and mints real PocketBase sessions (via the
  # superuser impersonate API) once a passkey ceremony verifies. No-op /
  # fails to start until PB_SUPERUSER_* below are set — see
  # docs/DEPLOYMENT.md "Passkey sign-in (WebAuthn)".
  webauthn:
    build: ./webauthn-service
    container_name: barangay-webauthn
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      - PB_URL=http://pocketbase:8090
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL:-}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD:-}
      - RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - RP_NAME=${WEBAUTHN_RP_NAME:-CLUSTR Barangay OS}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-http://localhost:8080}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_LOCAL_API_URL: ${VITE_LOCAL_API_URL:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: barangay-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    # Mount custom mkcert certs (run scripts/generate-certs.ps1 first)
    volumes: [ "./certs:/etc/nginx/certs" ]
    depends_on:
      - pocketbase
      - webauthn

volumes:
  pb_data:
